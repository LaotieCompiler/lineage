name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - name: Unit tests (golden corpus, mutation robustness)
        run: mvn -B clean test

  jdbc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - name: JDBC metadata integration tests
        env:
          MYSQL_IMAGE: mysql:8.0
        run: ./scripts/run-jdbc-docker-tests.sh
